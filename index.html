<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 dark:bg-slate-900 transition-colors duration-200">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GG Book Share Club</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="h-full flex flex-col text-slate-800 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white">

  <!-- App Wrapper -->
  <div id="app" class="min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm transition-colors">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          
          <!-- Logo & Cute Book Monster Mascot -->
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-brand-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-brand-500/20 transform hover:scale-105 transition-transform">
              <!-- Cute Book Monster SVG -->
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="3" width="16" height="18" rx="3" fill="#22c55e" stroke="#15803d" />
                <path d="M4 7h16" stroke="#ffffff" stroke-width="1.5"/>
                <!-- Cute Eyes -->
                <circle cx="9" cy="12" r="2" fill="#ffffff"/>
                <circle cx="9.5" cy="12" r="0.8" fill="#000000"/>
                <circle cx="15" cy="12" r="2" fill="#ffffff"/>
                <circle cx="15.5" cy="12" r="0.8" fill="#000000"/>
                <!-- Cute Monster Mouth -->
                <path d="M10 16c1 1 3 1 4 0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
                <polygon points="11,15 12,16 13,15" fill="#ffffff"/>
              </svg>
            </div>
            <div>
              <h1 class="text-xl font-black tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                GG Book Share Club
              </h1>
            </div>
          </div>

          <!-- Actions & Identity Selector -->
          <div class="flex items-center gap-3">
            
            <!-- Active User Identity Dropdown -->
            <div class="flex items-center bg-slate-100 dark:bg-slate-700/60 p-1.5 rounded-xl border border-slate-200 dark:border-slate-600">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 px-2 hidden sm:inline">I am:</span>
              <select id="activeUserSelect" class="bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-medium text-sm rounded-lg px-2.5 py-1 border border-slate-300 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <!-- Populated dynamically -->
              </select>
            </div>

            <!-- Add Book Button -->
            <button onclick="openAddBookModal()" class="inline-flex items-center gap-2 px-3.5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm rounded-xl shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-brand-500">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span class="hidden sm:inline">Add Book</span>
            </button>

            <!-- Dark Mode Toggle -->
            <button onclick="toggleDarkMode()" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-colors" title="Toggle Theme">
              <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
              <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
            </button>
            
          </div>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

      <!-- Navigation & Stats Bar -->
      <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
        
        <!-- View Switcher Tabs -->
        <div class="flex bg-slate-100 dark:bg-slate-700/50 p-1 rounded-xl gap-1">
          <button id="viewHoldingsBtn" onclick="switchMainView('holdings')" class="flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold rounded-lg transition-all shadow-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-white">
            <i data-lucide="users" class="w-4 h-4"></i>
            Individual Holdings
          </button>
          <button id="viewLibraryBtn" onclick="switchMainView('library')" class="flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
            <i data-lucide="library" class="w-4 h-4"></i>
            Full Library
          </button>
        </div>

        <!-- Quick Club Stats -->
        <div class="flex items-center justify-around md:justify-end gap-6 text-sm border-t md:border-t-0 border-slate-100 dark:border-slate-700/60 pt-3 md:pt-0">
          <div class="text-center md:text-right">
            <span class="text-xs text-slate-500 dark:text-slate-400 block font-medium">Total Books</span>
            <span id="statTotalBooks" class="text-base font-black text-slate-900 dark:text-white">0</span>
          </div>
          <div class="w-px h-8 bg-slate-200 dark:bg-slate-700"></div>
          <div class="text-center md:text-right">
            <span class="text-xs text-slate-500 dark:text-slate-400 block font-medium">On Loan</span>
            <span id="statOnLoan" class="text-base font-black text-amber-600 dark:text-amber-400">0</span>
          </div>
          <div class="w-px h-8 bg-slate-200 dark:bg-slate-700"></div>
          <div class="text-center md:text-right">
            <span class="text-xs text-slate-500 dark:text-slate-400 block font-medium">Members</span>
            <span id="statMembers" class="text-base font-black text-slate-900 dark:text-white">0</span>
          </div>
        </div>

      </div>

      <!-- SECTION 1: Individual Holdings View -->
      <section id="sectionHoldings" class="flex flex-col gap-6">
        
        <!-- Alphabetical Member Navigation Tabs -->
        <div class="flex items-center justify-between gap-2 overflow-x-auto pb-2 scrollbar-none border-b border-slate-200 dark:border-slate-700" id="memberTabsContainer">
          <!-- Dynamically populated pills -->
        </div>

        <!-- Selected Member Shelf Hero -->
        <div id="memberShelfHeader" class="bg-gradient-to-r from-brand-500/10 via-brand-500/5 to-transparent p-6 rounded-2xl border border-brand-500/20 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <div id="memberAvatar" class="w-14 h-14 rounded-2xl bg-brand-600 text-white text-xl font-bold flex items-center justify-center shadow-lg shadow-brand-500/20">
              ?
            </div>
            <div>
              <h2 id="memberNameHeading" class="text-2xl font-black text-slate-900 dark:text-white">
                Member's Books
              </h2>
              <p id="memberSubheading" class="text-sm text-slate-600 dark:text-slate-400">
                Currently holding 0 books
              </p>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="openManageMembersModal()" class="text-xs font-semibold px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors inline-flex items-center gap-1.5">
              <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
              Manage Members
            </button>
          </div>
        </div>

        <!-- Member's Book Grid -->
        <div id="memberBookGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <!-- Cards render here -->
        </div>

      </section>

      <!-- SECTION 2: Full Library View -->
      <section id="sectionLibrary" class="hidden flex-col gap-6">
        
        <!-- Search & Filter Controls -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
          
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="librarySearchInput" oninput="renderLibraryView()" placeholder="Search title, author, owner, or holder..." class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 dark:text-white">
          </div>

          <div class="flex items-center gap-1 overflow-x-auto">
            <button onclick="setLibraryFilter('all')" id="filterBtnAll" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-brand-500 text-white transition-colors">
              All Books
            </button>
            <button onclick="setLibraryFilter('available')" id="filterBtnAvailable" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition-colors">
              Available
            </button>
            <button onclick="setLibraryFilter('loaned')" id="filterBtnLoaned" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition-colors">
              On Loan
            </button>
          </div>

        </div>

        <!-- Full Library Book Grid -->
        <div id="fullLibraryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <!-- All Books render here -->
        </div>

      </section>

    </main>

  </div>

  <!-- MODAL 1: Add Book Modal (with Owner dropdown) -->
  <div id="addBookModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col gap-5 max-h-[90vh]">
      
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-brand-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="3" width="16" height="18" rx="2" fill="#22c55e" stroke="#15803d" />
            <circle cx="9" cy="11" r="1.5" fill="#fff"/><circle cx="15" cy="11" r="1.5" fill="#fff"/>
            <path d="M10 15c1 1 3 1 4 0" stroke="#fff" stroke-width="1.5"/>
          </svg>
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">Add Book to Club</h3>
        </div>
        <button onclick="closeModal('addBookModal')" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-white rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Open Library Search -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Search Open Library Database</label>
        <div class="flex gap-2">
          <input type="text" id="openLibraryQuery" placeholder="Search title, author, or ISBN..." class="flex-1 px-3.5 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 dark:text-white" onkeydown="if(event.key==='Enter') searchOpenLibrary()">
          <button onclick="searchOpenLibrary()" class="px-4 py-2 bg-slate-900 dark:bg-slate-700 text-white rounded-xl text-sm font-semibold hover:bg-slate-800 transition-colors">
            Search
          </button>
        </div>
      </div>

      <div id="openLibraryResults" class="flex flex-col gap-2 overflow-y-auto max-h-48 scrollbar-none border border-slate-100 dark:border-slate-700/50 rounded-xl p-2 bg-slate-50/50 dark:bg-slate-900/50 hidden">
      </div>

      <div class="relative flex items-center my-1">
        <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
        <span class="flex-shrink mx-3 text-xs uppercase font-bold text-slate-400">Or Manual Entry</span>
        <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
      </div>

      <!-- Book Form -->
      <form id="addBookForm" onsubmit="handleAddBookSubmit(event)" class="flex flex-col gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400">Book Title *</label>
          <input type="text" id="formTitle" required placeholder="e.g. Tomorrow, and Tomorrow, and Tomorrow" class="w-full mt-1 px-3.5 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 dark:text-white">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400">Author *</label>
          <input type="text" id="formAuthor" required placeholder="e.g. Gabrielle Zevin" class="w-full mt-1 px-3.5 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 dark:text-white">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400">Cover Image URL (Optional)</label>
          <input type="url" id="formCoverUrl" placeholder="https://..." class="w-full mt-1 px-3.5 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 dark:text-white">
        </div>

        <!-- OWNER SELECTION FIELD -->
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400">Who owns this book? *</label>
          <select id="formOwnerSelect" required class="w-full mt-1 px-3.5 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 dark:text-white">
            <!-- Populated dynamically -->
          </select>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-700">
          <button type="button" onclick="closeModal('addBookModal')" class="px-4 py-2 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl">
            Cancel
          </button>
          <button type="submit" class="px-5 py-2 text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-sm">
            Save Book
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- MODAL 2: Pass Book Modal -->
  <div id="passBookModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col gap-5">
      
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-2">
          <i data-lucide="arrow-right-left" class="w-5 h-5 text-brand-600"></i>
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">Pass / Loan Book</h3>
        </div>
        <button onclick="closeModal('passBookModal')" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-white rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="passBookDetailHeader" class="bg-slate-50 dark:bg-slate-900 p-3 rounded-xl flex items-center gap-3">
        <!-- Injected -->
      </div>

      <form id="passBookForm" onsubmit="handlePassBookSubmit(event)" class="flex flex-col gap-4">
        <input type="hidden" id="passBookId">
        
        <div>
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Pass Book To:</label>
          <select id="passTargetUserSelect" required class="w-full mt-1.5 px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-semibold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
            <!-- Dynamic -->
          </select>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-700">
          <button type="button" onclick="closeModal('passBookModal')" class="px-4 py-2 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl">
            Cancel
          </button>
          <button type="submit" class="px-5 py-2 text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-sm">
            Confirm Transfer
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- MODAL 3: Manage Members -->
  <div id="manageMembersModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col gap-5">
      
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-2">
          <i data-lucide="users" class="w-5 h-5 text-brand-600"></i>
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">Manage Members</h3>
        </div>
        <button onclick="closeModal('manageMembersModal')" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-white rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form onsubmit="handleAddMemberSubmit(event)" class="flex gap-2">
        <input type="text" id="newMemberNameInput" required placeholder="New member name..." class="flex-1 px-3.5 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 dark:text-white">
        <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold transition-colors">
          Add
        </button>
      </form>

      <div class="flex flex-col gap-2 max-h-60 overflow-y-auto scrollbar-none" id="manageMembersList">
        <!-- Rendered dynamically -->
      </div>

      <div class="flex justify-end pt-3 border-t border-slate-100 dark:border-slate-700">
        <button type="button" onclick="closeModal('manageMembersModal')" class="px-5 py-2 text-sm font-semibold bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-200 rounded-xl">
          Done
        </button>
      </div>

    </div>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    // LIVE FIREBASE CREDENTIALS
    const firebaseConfig = {
      apiKey: "AIzaSyASu0_zFykfL_r_7km2eTs9zAZo-mziqVA",
      authDomain: "gg-book-share-club.firebaseapp.com",
      projectId: "gg-book-share-club",
      storageBucket: "gg-book-share-club.firebasestorage.app",
      messagingSenderId: "15986078629",
      appId: "1:15986078629:web:55e119d3476eae75ed6e4c",
      measurementId: "G-7ZVN077WG4"
    };

    let db = null;
    let auth = null;
    let isFirebaseReady = false;

    // Alphabetical Default Members List
    const DEFAULT_MEMBERS = [
      "Andrea", "Cheryl", "Courtney", "Jen P", "Kim B", "Roxana", "Sarah P", "Stephanie"
    ];

    let members = [...DEFAULT_MEMBERS];
    let books = [];
    let activeUser = "Andrea";
    let selectedMemberTab = "Andrea";
    let currentMainView = "holdings";
    let libraryFilter = "all";

    window.addEventListener('DOMContentLoaded', async () => {
      initIcons();
      loadLocalState();
      setupFirebase();
    });

    function initIcons() {
      if (window.lucide) lucide.createIcons();
    }

    function loadLocalState() {
      const savedUser = localStorage.getItem('gg_activeUser');
      if (savedUser && members.includes(savedUser)) activeUser = savedUser;
      
      const savedTab = localStorage.getItem('gg_selectedTab');
      if (savedTab && members.includes(savedTab)) selectedMemberTab = savedTab;
    }

    async function setupFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
        auth = firebase.auth();

        await auth.signInAnonymously();
        isFirebaseReady = true;

        // Sync Members from Database
        db.collection('members').onSnapshot(snapshot => {
          if (!snapshot.empty) {
            const fetched = [];
            snapshot.forEach(doc => fetched.push(doc.data().name));
            members = Array.from(new Set(fetched)).sort((a, b) => a.localeCompare(b));
          } else {
            DEFAULT_MEMBERS.forEach(name => {
              db.collection('members').doc(name).set({ name });
            });
          }
          ensureActiveUserValid();
          renderUI();
        }, err => console.warn("Members Sync Error: ", err));

        // Sync Books from Database
        db.collection('books').onSnapshot(snapshot => {
          books = [];
          snapshot.forEach(doc => {
            books.push({ id: doc.id, ...doc.data() });
          });
          renderUI();
        }, err => console.warn("Books Sync Error: ", err));

      } catch (e) {
        console.warn("Firebase fallback mode:", e);
        renderUI();
      }
    }

    function ensureActiveUserValid() {
      if (!members.includes(activeUser) && members.length > 0) {
        activeUser = members[0];
      }
      if (!members.includes(selectedMemberTab) && members.length > 0) {
        selectedMemberTab = members[0];
      }
    }

    function renderUI() {
      members.sort((a, b) => a.localeCompare(b));
      
      renderActiveUserSelect();
      renderStats();
      renderMemberTabs();
      
      if (currentMainView === 'holdings') {
        renderHoldingsView();
      } else {
        renderLibraryView();
      }

      initIcons();
    }

    function renderActiveUserSelect() {
      const select = document.getElementById('activeUserSelect');
      const ownerSelect = document.getElementById('formOwnerSelect');

      select.innerHTML = members.map(m => `
        <option value="${m}" ${m === activeUser ? 'selected' : ''}>${m}</option>
      `).join('');

      select.onchange = (e) => {
        activeUser = e.target.value;
        localStorage.setItem('gg_activeUser', activeUser);
        renderUI();
      };

      if (ownerSelect) {
        ownerSelect.innerHTML = members.map(m => `
          <option value="${m}" ${m === activeUser ? 'selected' : ''}>${m}</option>
        `).join('');
      }
    }

    function renderStats() {
      document.getElementById('statTotalBooks').innerText = books.length;
      document.getElementById('statOnLoan').innerText = books.filter(b => b.holder !== b.owner).length;
      document.getElementById('statMembers').innerText = members.length;
    }

    function renderMemberTabs() {
      const container = document.getElementById('memberTabsContainer');
      container.innerHTML = members.map(m => {
        const holdingsCount = books.filter(b => b.holder === m).length;
        const isSelected = m === selectedMemberTab;

        return `
          <button onclick="selectMemberTab('${m}')" class="px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 whitespace-nowrap transition-all ${
            isSelected 
              ? 'bg-brand-600 text-white shadow-md shadow-brand-500/20' 
              : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:border-brand-500'
          }">
            <span>${m}</span>
            <span class="px-2 py-0.5 text-xs rounded-full ${
              isSelected ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'
            }">${holdingsCount}</span>
          </button>
        `;
      }).join('');
    }

    function selectMemberTab(name) {
      selectedMemberTab = name;
      localStorage.setItem('gg_selectedTab', name);
      renderUI();
    }

    function renderHoldingsView() {
      const heading = document.getElementById('memberNameHeading');
      const subheading = document.getElementById('memberSubheading');
      const avatar = document.getElementById('memberAvatar');
      const grid = document.getElementById('memberBookGrid');

      heading.innerText = `${selectedMemberTab}'s Shelf`;
      avatar.innerText = selectedMemberTab.charAt(0).toUpperCase();

      const memberBooks = books.filter(b => b.holder === selectedMemberTab);
      subheading.innerText = `Currently holding ${memberBooks.length} book${memberBooks.length === 1 ? '' : 's'}`;

      if (memberBooks.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 flex flex-col items-center justify-center text-center bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700 p-8">
            <svg class="w-12 h-12 text-slate-300 dark:text-slate-600 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor"/>
              <circle cx="9" cy="11" r="1.5"/><circle cx="15" cy="11" r="1.5"/>
              <path d="M10 15c1 1 3 1 4 0"/>
            </svg>
            <h4 class="text-base font-bold text-slate-700 dark:text-slate-300">${selectedMemberTab} has no books right now.</h4>
            <p class="text-xs text-slate-400 max-w-sm mt-1">Pass a book to ${selectedMemberTab} or switch to the Full Library to find books to borrow.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = memberBooks.map(book => createBookCardHTML(book)).join('');
    }

    function renderLibraryView() {
      const grid = document.getElementById('fullLibraryGrid');
      const searchQuery = (document.getElementById('librarySearchInput')?.value || '').toLowerCase();

      let filtered = books.filter(b => {
        const matchesSearch = b.title.toLowerCase().includes(searchQuery) ||
                              b.author.toLowerCase().includes(searchQuery) ||
                              (b.owner && b.owner.toLowerCase().includes(searchQuery)) ||
                              (b.holder && b.holder.toLowerCase().includes(searchQuery));
        
        if (!matchesSearch) return false;

        if (libraryFilter === 'available') return b.holder === b.owner;
        if (libraryFilter === 'loaned') return b.holder !== b.owner;
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 flex flex-col items-center justify-center text-center bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700 p-8">
            <i data-lucide="search-x" class="w-12 h-12 text-slate-300 dark:text-slate-600 mb-3"></i>
            <h4 class="text-base font-bold text-slate-700 dark:text-slate-300">No books found matching your filter.</h4>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(book => createBookCardHTML(book)).join('');
    }

    // ORIGINAL BOOK CARD WITH OWNER & HOLDER BADGES
    function createBookCardHTML(book) {
      const isOwner = book.owner === book.holder;
      const defaultCover = 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&q=80&w=300';
      const coverUrl = book.coverUrl || defaultCover;

      return `
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 flex flex-col justify-between gap-4 shadow-sm hover:shadow-md transition-all group">
          
          <div class="flex gap-3">
            <img src="${coverUrl}" alt="${book.title}" class="w-20 h-28 object-cover rounded-xl shadow-sm bg-slate-100 dark:bg-slate-900 flex-shrink-0" onerror="this.src='${defaultCover}'">
            
            <div class="flex flex-col justify-between flex-1 min-w-0">
              <div>
                <h3 class="font-bold text-sm text-slate-900 dark:text-white line-clamp-2 leading-tight group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">
                  ${book.title}
                </h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium mt-1 truncate">
                  ${book.author}
                </p>
              </div>

              <div class="flex flex-col gap-1 mt-2">
                <!-- Owner Badge -->
                <span class="inline-flex items-center gap-1 text-[11px] font-semibold text-slate-600 dark:text-slate-300">
                  <i data-lucide="user" class="w-3 h-3 text-slate-400"></i>
                  Owner: <strong class="text-slate-800 dark:text-white">${book.owner || 'Club'}</strong>
                </span>

                <!-- Holder Status -->
                ${isOwner ? `
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 w-fit">
                    <i data-lucide="check-circle" class="w-2.5 h-2.5"></i> With Owner
                  </span>
                ` : `
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 w-fit">
                    <i data-lucide="arrow-right-left" class="w-2.5 h-2.5"></i> With ${book.holder}
                  </span>
                `}
              </div>

            </div>
          </div>

          <div class="pt-3 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between gap-2">
            <button onclick="openPassBookModal('${book.id}')" class="flex-1 py-1.5 px-3 bg-brand-50 hover:bg-brand-100 dark:bg-brand-950/50 dark:hover:bg-brand-900 text-brand-700 dark:text-brand-300 font-semibold text-xs rounded-xl transition-colors flex items-center justify-center gap-1.5">
              <i data-lucide="send" class="w-3.5 h-3.5"></i>
              Pass Book
            </button>
            <button onclick="deleteBook('${book.id}')" class="p-1.5 text-slate-400 hover:text-red-500 rounded-lg transition-colors" title="Remove Book">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>

        </div>
      `;
    }

    function switchMainView(view) {
      currentMainView = view;
      const holdingsSec = document.getElementById('sectionHoldings');
      const librarySec = document.getElementById('sectionLibrary');
      const holdingsBtn = document.getElementById('viewHoldingsBtn');
      const libraryBtn = document.getElementById('viewLibraryBtn');

      if (view === 'holdings') {
        holdingsSec.classList.remove('hidden');
        librarySec.classList.add('hidden');
        holdingsBtn.className = "flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold rounded-lg transition-all shadow-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-white";
        libraryBtn.className = "flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all";
      } else {
        holdingsSec.classList.add('hidden');
        librarySec.classList.remove('hidden');
        libraryBtn.className = "flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold rounded-lg transition-all shadow-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-white";
        holdingsBtn.className = "flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all";
      }

      renderUI();
    }

    function setLibraryFilter(filter) {
      libraryFilter = filter;
      ['all', 'available', 'loaned'].forEach(f => {
        const btn = document.getElementById(`filterBtn${f.charAt(0).toUpperCase() + f.slice(1)}`);
        if (f === filter) {
          btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-brand-500 text-white transition-colors";
        } else {
          btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition-colors";
        }
      });
      renderLibraryView();
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function openAddBookModal() {
      renderActiveUserSelect();
      openModal('addBookModal');
    }

    async function searchOpenLibrary() {
      const query = document.getElementById('openLibraryQuery').value.trim();
      const container = document.getElementById('openLibraryResults');
      if (!query) return;

      container.classList.remove('hidden');
      container.innerHTML = `<p class="text-xs text-slate-400 p-2">Searching Open Library...</p>`;

      try {
        const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=4`);
        const data = await res.json();

        if (!data.docs || data.docs.length === 0) {
          container.innerHTML = `<p class="text-xs text-slate-400 p-2">No results found.</p>`;
          return;
        }

        container.innerHTML = data.docs.map(doc => {
          const title = doc.title || 'Unknown Title';
          const author = doc.author_name ? doc.author_name[0] : 'Unknown Author';
          const cover = doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : '';

          return `
            <div onclick="selectOpenLibraryBook('${escapeQuotes(title)}', '${escapeQuotes(author)}', '${cover}')" class="flex items-center gap-3 p-2 hover:bg-white dark:hover:bg-slate-800 rounded-lg cursor-pointer transition-colors border border-transparent hover:border-slate-200">
              ${cover ? `<img src="${cover}" class="w-8 h-12 object-cover rounded">` : `<div class="w-8 h-12 bg-slate-200 rounded flex items-center justify-center text-xs">📖</div>`}
              <div class="min-w-0 flex-1">
                <p class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate">${title}</p>
                <p class="text-[11px] text-slate-500 truncate">${author}</p>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        container.innerHTML = `<p class="text-xs text-red-500 p-2">Failed to search database.</p>`;
      }
    }

    function escapeQuotes(str) { return str.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

    function selectOpenLibraryBook(title, author, coverUrl) {
      document.getElementById('formTitle').value = title;
      document.getElementById('formAuthor').value = author;
      document.getElementById('formCoverUrl').value = coverUrl;
      document.getElementById('openLibraryResults').classList.add('hidden');
    }

    async function handleAddBookSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('formTitle').value.trim();
      const author = document.getElementById('formAuthor').value.trim();
      const coverUrl = document.getElementById('formCoverUrl').value.trim();
      const owner = document.getElementById('formOwnerSelect').value;

      const newBook = {
        title,
        author,
        coverUrl,
        owner,
        holder: owner,
        createdAt: Date.now()
      };

      if (isFirebaseReady) {
        await db.collection('books').add(newBook);
      } else {
        books.push({ id: 'local_' + Date.now(), ...newBook });
        renderUI();
      }

      closeModal('addBookModal');
      document.getElementById('addBookForm').reset();
    }

    function openPassBookModal(bookId) {
      const book = books.find(b => b.id === bookId);
      if (!book) return;

      document.getElementById('passBookId').value = book.id;
      
      const header = document.getElementById('passBookDetailHeader');
      const defaultCover = 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&q=80&w=300';
      
      header.innerHTML = `
        <img src="${book.coverUrl || defaultCover}" class="w-10 h-14 object-cover rounded-lg shadow-sm">
        <div>
          <h4 class="font-bold text-sm text-slate-900 dark:text-white">${book.title}</h4>
          <p class="text-xs text-slate-500">Currently with: <strong>${book.holder}</strong></p>
        </div>
      `;

      const targetSelect = document.getElementById('passTargetUserSelect');
      targetSelect.innerHTML = members
        .filter(m => m !== book.holder)
        .map(m => `<option value="${m}">${m}</option>`).join('');

      openModal('passBookModal');
    }

    async function handlePassBookSubmit(e) {
      e.preventDefault();
      const bookId = document.getElementById('passBookId').value;
      const targetUser = document.getElementById('passTargetUserSelect').value;

      if (isFirebaseReady) {
        await db.collection('books').doc(bookId).update({ holder: targetUser });
      } else {
        const book = books.find(b => b.id === bookId);
        if (book) book.holder = targetUser;
        renderUI();
      }

      closeModal('passBookModal');
    }

    async function deleteBook(bookId) {
      if (!confirm("Are you sure you want to remove this book from the library?")) return;
      
      if (isFirebaseReady) {
        await db.collection('books').doc(bookId).delete();
      } else {
        books = books.filter(b => b.id !== bookId);
        renderUI();
      }
    }

    function openManageMembersModal() {
      renderManageMembersList();
      openModal('manageMembersModal');
    }

    function renderManageMembersList() {
      const list = document.getElementById('manageMembersList');
      list.innerHTML = members.map(m => `
        <div class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-900 rounded-xl">
          <span class="text-sm font-semibold text-slate-800 dark:text-slate-200">${m}</span>
          <button onclick="removeMember('${m}')" class="p-1 text-slate-400 hover:text-red-500 rounded-lg">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');
      initIcons();
    }

    async function handleAddMemberSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('newMemberNameInput');
      const name = input.value.trim();

      if (name && !members.includes(name)) {
        if (isFirebaseReady) {
          await db.collection('members').doc(name).set({ name });
        } else {
          members.push(name);
          renderUI();
        }
        input.value = '';
        renderManageMembersList();
      }
    }

    async function removeMember(name) {
      if (members.length <= 1) {
        alert("You must keep at least one member.");
        return;
      }
      if (!confirm(`Remove ${name}?`)) return;

      if (isFirebaseReady) {
        await db.collection('members').doc(name).delete();
      } else {
        members = members.filter(m => m !== name);
        renderUI();
      }
      renderManageMembersList();
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }
  </script>
</body>
</html>
